name: Release Universal CAD Studio v0.29.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0294-board-editor.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.29.4 Board Editor behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re
          from datetime import datetime, timezone

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def require_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected source for {label}')
              return text.replace(old, new, 1)

          # 1) Import must never force-open Board Editor.
          app = read('app.js')
          app = require_replace(app,
              "  let importSucceeded = false;\n  let autoOpenEditor = false;\n",
              "  let importSucceeded = false;\n",
              'autoOpenEditor declaration')
          app = require_replace(app,
              "    autoOpenEditor = Boolean(importedRole && state.xmlData && !state.xlsxData && !canCompareCad());\n",
              "",
              'autoOpenEditor assignment')
          app = require_replace(app,
              "    if (autoOpenEditor) setTimeout(() => { if (state.xmlData) openCadEditor(); }, 0);\n",
              "",
              'autoOpenEditor execution')
          write('app.js', app)

          # 2) Add an explicit user-controlled fullscreen button to Board Editor.
          html = read('index.html')
          button_anchor = '<button id="cadStudioOpenButton" title="Open a new CAD file" type="button">Open File</button>\n<button aria-label="Close" class="icon-button" id="closeCadEditorButton" type="button">✕</button>'
          button_replacement = '<button id="cadStudioOpenButton" title="Open a new CAD file" type="button">Open File</button>\n<button aria-pressed="false" id="cadStudioFullscreenButton" title="Expand Board Editor" type="button">⛶ Fullscreen</button>\n<button aria-label="Close" class="icon-button" id="closeCadEditorButton" type="button">✕</button>'
          html = require_replace(html, button_anchor, button_replacement, 'Board Editor fullscreen button')
          html = html.replace('The editor will open here as a full workspace instead of a popup.', 'The editor opens inside this workspace. Use Fullscreen only when you want to expand it.')
          write('index.html', html)

          # 3) Fullscreen is opt-in and automatically exits when leaving Board Editor.
          shell = read('ui-shell.js')
          fullscreen_code = '''function setEditorFullscreen(enabled) {
            const active = Boolean(enabled);
            document.body.classList.toggle('cad-editor-user-fullscreen', active);
            const button = $('cadStudioFullscreenButton');
            if (button) {
              button.textContent = active ? '⤢ Exit Fullscreen' : '⛶ Fullscreen';
              button.setAttribute('aria-pressed', active ? 'true' : 'false');
              button.title = active ? 'Return Board Editor to workspace' : 'Expand Board Editor';
            }
          }
          function toggleEditorFullscreen() {
            setEditorFullscreen(!document.body.classList.contains('cad-editor-user-fullscreen'));
          }

          '''
          anchor = 'function setEmbeddedModalState(overlay, embedded = true) {'
          if 'function setEditorFullscreen(enabled)' not in shell:
              if anchor not in shell:
                  raise SystemExit('missing ui-shell fullscreen insertion anchor')
              shell = shell.replace(anchor, fullscreen_code + anchor, 1)
          shell = require_replace(shell,
              "  document.body.dataset.workspace = next;\n",
              "  document.body.dataset.workspace = next;\n  if (next !== 'editor') setEditorFullscreen(false);\n",
              'workspace fullscreen reset')
          shell = require_replace(shell,
              "  $('globalSearchButton')?.addEventListener('click', runGlobalSearch);\n",
              "  $('globalSearchButton')?.addEventListener('click', runGlobalSearch);\n  $('cadStudioFullscreenButton')?.addEventListener('click', toggleEditorFullscreen);\n",
              'fullscreen event binding')
          shell = require_replace(shell,
              "    if (event.key === 'Escape') {\n      closeCommandPalette(); closeNotifications(); if (!$('exportCenterOverlay')?.classList.contains('workspace-embedded')) closeExportCenter();\n    }\n",
              "    if (event.key === 'Escape') {\n      if (document.body.classList.contains('cad-editor-user-fullscreen')) { setEditorFullscreen(false); return; }\n      closeCommandPalette(); closeNotifications(); if (!$('exportCenterOverlay')?.classList.contains('workspace-embedded')) closeExportCenter();\n    }\n",
              'fullscreen Escape behavior')
          write('ui-shell.js', shell)

          # 4) Override v0.29.3 forced-immersive CSS: default is embedded workspace.
          css = read('styles.css')
          marker = '/* v0.29.4 Board Editor navigation + opt-in fullscreen */'
          if marker not in css:
              css += r'''

          /* v0.29.4 Board Editor navigation + opt-in fullscreen
             Board Editor stays inside the routed workspace by default. The viewport
             takeover is enabled only by the explicit Fullscreen button. */
          body[data-workspace="editor"]:not(.cad-editor-user-fullscreen) {
            overflow: hidden !important;
          }
          body[data-workspace="editor"]:not(.cad-editor-user-fullscreen) #editorWorkspacePage {
            position: static !important;
            inset: auto !important;
            z-index: auto !important;
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            min-width: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: transparent !important;
            display: grid !important;
            grid-template-rows: auto minmax(0, 1fr) !important;
            gap: 10px !important;
          }
          body[data-workspace="editor"]:not(.cad-editor-user-fullscreen) #editorWorkspaceHost {
            position: relative !important;
            inset: auto !important;
            z-index: auto !important;
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            min-width: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: transparent !important;
          }
          body[data-workspace="editor"]:not(.cad-editor-user-fullscreen) #editorWorkspacePage > .route-page-heading {
            display: flex !important;
          }
          body[data-workspace="editor"]:not(.cad-editor-user-fullscreen) #cadEditorOverlay.workspace-embedded {
            position: relative !important;
            inset: auto !important;
            z-index: auto !important;
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
            backdrop-filter: none !important;
          }
          body[data-workspace="editor"]:not(.cad-editor-user-fullscreen) #cadEditorOverlay.workspace-embedded .cad-editor-dialog,
          body[data-workspace="editor"]:not(.cad-editor-user-fullscreen) #cadEditorOverlay.workspace-embedded .cad-studio-shell {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
            min-width: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            border: 1px solid var(--line-soft) !important;
            border-radius: 14px !important;
          }

          body.cad-editor-user-fullscreen[data-workspace="editor"] #editorWorkspacePage,
          body.cad-editor-user-fullscreen[data-workspace="editor"] #editorWorkspaceHost,
          body.cad-editor-user-fullscreen[data-workspace="editor"] #cadEditorOverlay.workspace-embedded {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
            max-width: none !important;
            max-height: none !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: var(--bg) !important;
          }
          body.cad-editor-user-fullscreen[data-workspace="editor"] #editorWorkspacePage { z-index: 180 !important; }
          body.cad-editor-user-fullscreen[data-workspace="editor"] #editorWorkspaceHost { z-index: 185 !important; }
          body.cad-editor-user-fullscreen[data-workspace="editor"] #cadEditorOverlay.workspace-embedded { z-index: 190 !important; }
          body.cad-editor-user-fullscreen[data-workspace="editor"] #editorWorkspacePage > .route-page-heading,
          body.cad-editor-user-fullscreen[data-workspace="editor"] #editorWorkspaceEmpty { display: none !important; }
          body.cad-editor-user-fullscreen[data-workspace="editor"] #cadEditorOverlay.workspace-embedded .cad-editor-dialog,
          body.cad-editor-user-fullscreen[data-workspace="editor"] #cadEditorOverlay.workspace-embedded .cad-studio-shell {
            width: 100vw !important;
            height: 100dvh !important;
            max-width: none !important;
            max-height: none !important;
            min-width: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
          }

          @media (max-width: 820px) {
            body[data-workspace="editor"]:not(.cad-editor-user-fullscreen) #editorWorkspacePage {
              min-height: calc(100dvh - 150px) !important;
            }
            body[data-workspace="editor"]:not(.cad-editor-user-fullscreen) #editorWorkspaceHost {
              min-height: 620px !important;
            }
          }
          '''
          write('styles.css', css)

          # 5) Promote runtime version to 0.29.4 without rewriting historical CSS comments.
          runtime_exts = {'.js', '.json', '.html', '.webmanifest'}
          for path in Path('.').iterdir():
              if not path.is_file() or path.suffix not in runtime_exts:
                  continue
              text = path.read_text(encoding='utf-8')
              if '0.29.3' in text:
                  path.write_text(text.replace('0.29.3', '0.29.4'), encoding='utf-8')

          info = json.loads(read('build-info.json'))
          info['appVersion'] = '0.29.4'
          info['buildDate'] = datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')
          write('build-info.json', json.dumps(info, indent=2) + '\n')
          PY

      - name: Verify v0.29.4 release gate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check ui-shell.js
          node --check sw.js
          node --check cad-editor.js
          grep -q '<title>Universal CAD Studio v0.29.4</title>' index.html
          grep -q '"appVersion": "0.29.4"' build-info.json
          grep -q '"version": "0.29.4"' manifest.webmanifest
          grep -q "const APP_VERSION = '0.29.4'" sw.js
          grep -q 'id="cadStudioFullscreenButton"' index.html
          grep -q 'function setEditorFullscreen(enabled)' ui-shell.js
          grep -q 'cad-editor-user-fullscreen' styles.css
          grep -q 'v0.29.4 Board Editor navigation + opt-in fullscreen' styles.css
          if grep -q 'autoOpenEditor' app.js; then
            echo 'autoOpenEditor still exists' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          app = Path('app.js').read_text(encoding='utf-8')
          shell = Path('ui-shell.js').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'if (autoOpenEditor)' not in app
          assert 'cadStudioFullscreenButton' in html
          assert "next !== 'editor'" in shell
          assert ':not(.cad-editor-user-fullscreen) #cadEditorOverlay.workspace-embedded' in css
          assert 'body.cad-editor-user-fullscreen[data-workspace="editor"]' in css
          PY

      - name: Commit v0.29.4
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/release-v0294-board-editor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html ui-shell.js styles.css build-info.json manifest.webmanifest sw.js '*.js' '*.json' '*.html' '*.webmanifest'
          git commit -m 'Release Universal CAD Studio v0.29.4'
          git push origin HEAD:main
