name: Apply v0.27.0 release

on:
  push:
    branches: [main]
    paths:
      - 'v027.patch.gz.b64'
      - '.github/workflows/apply-v027.yml'

permissions:
  contents: write

jobs:
  apply-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested production patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d v027.patch.gz.b64 > /tmp/v027.patch.gz
          gzip -dc /tmp/v027.patch.gz > /tmp/v027.patch
          git apply --check /tmp/v027.patch
          git apply /tmp/v027.patch
      - name: Production sanity gate
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f precache-manifest.js
          test -f target-profile-engine.js
          test -f geometry-engine2.js
          test -f npi-automation.js
          test -f worker-pipeline.js
          test -f pcb-data-coverage.js
          grep -q '0.27.0' index.html
          grep -q '0.27.0' manifest.webmanifest
          grep -q '0.27.0' sw.js
          grep -q 'target-profile-engine.js' precache-manifest.js
          grep -q 'geometry-engine2.js' precache-manifest.js
          grep -q 'npi-automation.js' precache-manifest.js
          grep -q 'worker-pipeline.js' precache-manifest.js
          grep -q 'pcb-data-coverage.js' precache-manifest.js
      - name: Commit v0.27.0
        shell: bash
        run: |
          set -euo pipefail
          rm -f v027.patch.gz.b64 .github/workflows/apply-v027.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Universal CAD Studio v0.27.0'
          git push origin main
