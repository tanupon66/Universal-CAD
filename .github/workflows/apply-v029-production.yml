name: Apply v0.29.0 production release

on:
  push:
    branches: [main]
    paths:
      - 'v029-release.trigger'

permissions:
  contents: write

jobs:
  apply-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply tested v0.29.0 production patch
        shell: bash
        run: |
          set -euo pipefail
          cat v029-payload.part00 v029-payload.part01 v029-payload.part02 v029-payload.part03 v029-payload.part04 v029-payload.part05 > /tmp/v029.b64
          echo "053eebfda4b82b51e2ea4d1ca1140ecd8a9b240b29cc3add3dae07eafb786ef6  /tmp/v029.b64" | sha256sum -c -
          base64 -d /tmp/v029.b64 > /tmp/v029.patch.gz
          echo "8c93aeeb9934ff3ee408f2488bc787b06826322624a5c8f0143ffd8ccdfbfb8e  /tmp/v029.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v029.patch.gz > /tmp/v029.patch
          echo "a58ca008d0e11acf2db0a9647ed2afbf97836540117af8310875a3a5db02541d  /tmp/v029.patch" | sha256sum -c -
          cat > build-info.json <<'JSON'
          {
            "appVersion": "0.27.0",
            "buildDate": "2026-08-26T10:24:49.251Z",
            "commit": "unavailable",
            "schemaVersion": 2
          }
          JSON
          git apply --check /tmp/v029.patch
          git apply /tmp/v029.patch
      - name: Static production sanity gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q '0.29.0' index.html
          grep -q '0.29.0' manifest.webmanifest
          grep -q "APP_VERSION = '0.29.0'" sw.js
          grep -q 'data-npi-tab="pcb-data"' index.html
          grep -q './pcb-data-foundation.js' precache-manifest.js
          test -s pcb-data-foundation.js
          test -s coordinate-system-manager.js
          test -s export-verification.js
          test -s ui-shell.js
      - name: Clean release staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f v029-payload.part00 v029-payload.part01 v029-payload.part02 v029-payload.part03 v029-payload.part04 v029-payload.part05 v029-release.trigger
          rm -f v028-prod-patch.part00 v028-prod-patch.part01 v028-prod-patch.part02
          rm -f .github/workflows/apply-v028-production.yml
          rm -f .github/workflows/apply-v029-production.yml
      - name: Commit v0.29.0 production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Universal CAD Studio v0.29.0'
          git push origin main
