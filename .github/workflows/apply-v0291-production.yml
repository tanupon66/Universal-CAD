name: Apply v0.29.1 production release

on:
  push:
    branches: [main]
    paths:
      - 'v0291-payload.part00'
      - 'v0291-payload.part01'
      - '.github/workflows/apply-v0291-production.yml'

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply tested v0.29.1 production patch
        shell: bash
        run: |
          set -euo pipefail
          cat v0291-payload.part00 v0291-payload.part01 > /tmp/v0291.b64
          echo "6e374b8303a0396409b61c0b258eb077121f05a8368127e15971ea2cd0429383  /tmp/v0291.b64" | sha256sum -c -
          base64 -d /tmp/v0291.b64 > /tmp/v0291.patch.gz
          echo "0dbee96e31e191452c394155da14b83bca0d46be0726dd0f88d010acdd454565  /tmp/v0291.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v0291.patch.gz > /tmp/v0291.patch
          echo "7a23d73a9e1182fa5b13d9a1befe431e7e229ddf91a570a3bb2b2c2a176805e5  /tmp/v0291.patch" | sha256sum -c -
          git apply --check /tmp/v0291.patch
          git apply /tmp/v0291.patch

      - name: Static production sanity gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q '0.29.1' index.html
          grep -q "const APP_VERSION = '0.29.1'" sw.js
          grep -q 'workspace-embedded' styles.css
          grep -q 'editorWorkspacePage' index.html
          grep -q 'npiWorkspacePage' index.html
          grep -q 'validationWorkspacePage' index.html
          grep -q 'exportWorkspacePage' index.html
          grep -q 'dockWorkspaceSurfaces' ui-shell.js
          grep -q 'workspace-embedded' npi-workspace-ui.js

      - name: Clean release staging files
        shell: bash
        run: |
          rm -f v0291-payload.part00 v0291-payload.part01
          rm -f .github/workflows/apply-v0291-production.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit v0.29.1 production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Universal CAD Studio v0.29.1"
          git push origin HEAD:main
