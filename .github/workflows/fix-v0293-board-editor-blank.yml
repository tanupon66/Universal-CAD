name: Fix v0.29.3 Board Editor blank route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v0293-board-editor-blank.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Board Editor empty-state hotfix
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'v0.29.3 Board Editor blank-route hotfix' styles.css; then
            cat >> styles.css <<'EOF'

          /* v0.29.3 Board Editor blank-route hotfix
             Keep the route heading/empty state visible until the embedded editor is
             actually opened. When the editor opens, JS adds .hidden to the empty state
             and the fixed editor overlay covers the route surface. */
          body[data-workspace="editor"] #editorWorkspacePage > .route-page-heading {
            display: flex !important;
          }
          body[data-workspace="editor"] #editorWorkspaceEmpty {
            display: grid !important;
          }
          body[data-workspace="editor"] #editorWorkspaceEmpty.hidden {
            display: none !important;
          }
          EOF
          fi

      - name: Verify hotfix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'v0.29.3 Board Editor blank-route hotfix' styles.css
          grep -q 'body\[data-workspace="editor"\] #editorWorkspaceEmpty.hidden' styles.css
          grep -q 'display: none !important' styles.css
          node --check app.js
          node --check ui-shell.js

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/fix-v0293-board-editor-blank.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css
          git commit -m 'Fix v0.29.3 Board Editor blank route'
          git push origin HEAD:main
